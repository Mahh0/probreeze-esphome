# =====================================================================
#  ProBreeze - ETAPE 6 : dp2 (humidite cible) machine ALLUMEE
# =====================================================================
substitutions:
  baud_rate: "9600"

esphome:
  name: probreeze-dp2b
  friendly_name: ProBreeze dp2 test

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf
  flash_size: 4MB

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

uart:
  id: uart_bus
  rx_pin:
    number: GPIO20
    mode: INPUT_PULLUP
  tx_pin:
    number: GPIO21
    mode: OUTPUT
  baud_rate: ${baud_rate}
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024
  debug:
    direction: BOTH
    dummy_receiver: true
    after:
      timeout: 20ms
    sequence:
      - lambda: |-
          UARTDebug::log_hex(direction, bytes, ':');

globals:
  - id: step
    type: int
    restore_value: false
    initial_value: "0"

script:
  - id: run
    then:
      - uart.write: [0x55,0xAA,0x00,0x00,0x00,0x00,0xFF]   # heartbeat
      - delay: 300ms
      - uart.write: [0x55,0xAA,0x00,0x01,0x00,0x00,0x00]   # product_query
      - delay: 300ms
      - uart.write: [0x55,0xAA,0x00,0x02,0x00,0x00,0x01]   # conf_query
      - delay: 300ms
      - uart.write: [0x55,0xAA,0x00,0x03,0x00,0x01,0x04,0x07]   # wifi_state
      - delay: 300ms
      - lambda: |-
          ESP_LOGI("t", "---- INIT SENT ----");
      - uart.write: [0x55,0xAA,0x00,0x06,0x00,0x05,0x01,0x01,0x00,0x01,0x01,0x0E]   # dp1 = 1
      - lambda: |-
          ESP_LOGI("t", "STEP 0 SET dp1 = 1");
      - delay: 2s
      - uart.write: [0x55,0xAA,0x00,0x08,0x00,0x00,0x07]   # dump
      - delay: 1s
      - uart.write: [0x55,0xAA,0x00,0x06,0x00,0x08,0x02,0x02,0x00,0x04,0x00,0x00,0x00,0x19,0x2E]   # dp2 = 25
      - lambda: |-
          ESP_LOGI("t", "STEP 1 SET dp2 = 25");
      - delay: 2s
      - uart.write: [0x55,0xAA,0x00,0x08,0x00,0x00,0x07]   # dump
      - delay: 1s
      - uart.write: [0x55,0xAA,0x00,0x06,0x00,0x08,0x02,0x02,0x00,0x04,0x00,0x00,0x00,0x1E,0x33]   # dp2 = 30
      - lambda: |-
          ESP_LOGI("t", "STEP 2 SET dp2 = 30");
      - delay: 2s
      - uart.write: [0x55,0xAA,0x00,0x08,0x00,0x00,0x07]   # dump
      - delay: 1s
      - uart.write: [0x55,0xAA,0x00,0x06,0x00,0x08,0x02,0x02,0x00,0x04,0x00,0x00,0x00,0x32,0x47]   # dp2 = 50
      - lambda: |-
          ESP_LOGI("t", "STEP 3 SET dp2 = 50");
      - delay: 2s
      - uart.write: [0x55,0xAA,0x00,0x08,0x00,0x00,0x07]   # dump
      - delay: 1s
      - uart.write: [0x55,0xAA,0x00,0x06,0x00,0x08,0x02,0x02,0x00,0x04,0x00,0x00,0x00,0x50,0x65]   # dp2 = 80
      - lambda: |-
          ESP_LOGI("t", "STEP 4 SET dp2 = 80");
      - delay: 2s
      - uart.write: [0x55,0xAA,0x00,0x08,0x00,0x00,0x07]   # dump
      - delay: 1s
      - uart.write: [0x55,0xAA,0x00,0x06,0x00,0x08,0x02,0x02,0x00,0x04,0x00,0x00,0x00,0x55,0x6A]   # dp2 = 85
      - lambda: |-
          ESP_LOGI("t", "STEP 5 SET dp2 = 85");
      - delay: 2s
      - uart.write: [0x55,0xAA,0x00,0x08,0x00,0x00,0x07]   # dump
      - delay: 1s
      - uart.write: [0x55,0xAA,0x00,0x06,0x00,0x08,0x02,0x02,0x00,0x04,0x00,0x00,0x00,0xBB,0xD0]   # dp2 = 187
      - lambda: |-
          ESP_LOGI("t", "STEP 6 SET dp2 = 187");
      - delay: 2s
      - uart.write: [0x55,0xAA,0x00,0x08,0x00,0x00,0x07]   # dump
      - delay: 1s
      - uart.write: [0x55,0xAA,0x00,0x06,0x00,0x08,0x02,0x02,0x00,0x04,0x00,0x00,0x00,0x32,0x47]   # dp2 = 50
      - lambda: |-
          ESP_LOGI("t", "STEP 7 SET dp2 = 50");
      - delay: 2s
      - uart.write: [0x55,0xAA,0x00,0x08,0x00,0x00,0x07]   # dump
      - delay: 1s

interval:
  - interval: 30s
    then:
      - script.execute: run
